# 봇 토큰은 이 파일에 넣지 않습니다.
# 서버 실행 환경 변수 DISCORD_BOT_TOKEN에 새로 발급한 토큰을 설정하세요.

# 봇이 들어가 있는 Discord 서버 ID입니다. 개발자 모드에서 서버를 우클릭해 복사할 수 있습니다.
guild-id: "PUT_DISCORD_GUILD_ID_HERE"

# /연동 후 Discord에서 코드를 확인할 수 있는 시간(초)
link-code-expiry-seconds: 300

# 연동이 끝나면 자동으로 지급할 Discord 역할 ID입니다. 비워 두면 역할을 지급하지 않습니다.
# 봇 역할이 이 역할보다 위에 있어야 하고, 봇에 역할 관리 권한이 필요합니다.
link-completion-role-id: ""

# 모든 마인크래프트 서버가 공유하는 계정 연동 API입니다. 비워 두면 이 서버의 Skript 변수에만 저장합니다.
# MariaDB 포트를 게임 서버에 직접 공개하지 않고 이 HTTPS API를 통해서만 접근합니다.
service-base-url: ""
service-shared-secret: "PUT_A_LONG_RANDOM_SHARED_SECRET_HERE"

# 기존 Skript 변수에만 저장된 Discord 연동을 최초 접속 시 공용 DB로 한 번 이전합니다.
migrate-local-links: true

# 접속 직후 다른 플러그인/Skript 로딩과 겹치지 않도록 동기화를 조금 늦춥니다.
join-sync-delay-ticks: 20

# 온라인 상태가 긴 플레이어도 다른 서버에서 변경된 연동을 다시 받아오는 주기입니다.
shared-link-refresh-seconds: 300
